name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-and-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --release --locked --all-features
      - run: cargo fmt --manifest-path web/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path web/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path web/Cargo.toml
      - run: cargo build --release --locked --manifest-path web/Cargo.toml
      - run: python3 web/smoke.py web/target/release/chen-web
      - run: node web/client-race-test.js
