[package]
name = "chen"
version = "0.1.0"
edition = "2024"
description = "A modular chess engine and architecture experiment laboratory"
license = "MIT"
default-run = "chen"

[features]
default = []
# Frozen ray-walk control for rule/search experiments; default uses SWAR.
ray-attacks = []
hip = ["dep:serde_json", "dep:sha2"]

[lib]
name = "chen"
path = "src/lib.rs"

[[bin]]
name = "chen"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1

[dependencies]
serde_json = { version = "1.0.151", optional = true }
sha2 = { version = "0.11.0", optional = true }
